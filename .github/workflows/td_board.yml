name: td-board

# Builds the NFL anytime-TD board + runs the H1 forward-tracker, commits artifacts back to this
# repo (auto-redeploys the app on Render).
#
# WHY DAILY, AND WHY ODD MINUTES: this ran 3x/week at :00 and the Sunday refresh was landing
# 2-4pm ET -- after the 1pm kickoffs -- because GitHub executes this repo's scheduled jobs 3-6h
# late and :00 is the most contended minute. Three runs a week also meant one delayed run left
# the board DAYS stale (it was 3 days old on Sun 2026-10-04 at noon ET). Daily + early + off-peak
# minutes fixes both, and picks up midweek line movement as a bonus.
# The board only prices upcoming games; ~16 games x 8 credits = ~130 per run.

on:
  schedule:
    # Times are chosen for DRIFT, not for neatness: GitHub has been running this repo's
    # scheduled jobs 3-6h late, and :00 is the most contended minute. See the header comment.
    - cron: '23 8 * * *'      # daily 08:23 UTC -- even +5h lands ~09:23 ET, before any kickoff
    - cron: '23 14 * * 0'     # Sun 10:23 ET  -- second pre-slate pass on the freshest odds
    - cron: '23 21 * * 1,4'   # Mon/Thu       -- ahead of the primetime game
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # SHARED across every board workflow: they all commit artifacts to main,
  # so they must queue rather than race each other's pushes.
  group: board-artifacts
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars scipy requests
      - name: Build board + tracker
        run: python scripts/td_board_cron.py
      - name: Commit artifacts
        run: |
          git config user.name  "td-board-bot"
          git config user.email "td-board-bot@users.noreply.github.com"
          git add td_board_latest.json nfl_watchlist_log.csv
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "td-board: refresh board + tracker [skip ci]"
          # The board bots race each other: all four push artifacts to main, GitHub delays
          # scheduled runs so they bunch together, and a bare push loses with "fetch first"
          # (mma-board died exactly this way on 2026-10-03 18:36Z, one minute after hr-board).
          # Rebase onto whatever landed first and retry with backoff so a lost race self-heals.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main && git push -q; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i lost the race; retrying"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
