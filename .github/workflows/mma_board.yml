name: mma-board

# Builds the UFC/MMA moneyline line-shopping board and commits it back to this repo
# (auto-redeploys the app on Render). Cards are usually Saturday, but odds move all fight week,
# so this runs twice a day every day:
#   15:00 UTC (11:00 ET) -- morning refresh
#   23:00 UTC (19:00 ET) -- evening, closer to card time for same-day moves
# Cost is trivial: h2h is a FEATURED market, so the whole-sport endpoint returns every event in
# ONE call -- about 1-2 credits per run for the entire board.

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # SHARED across every board workflow: they all commit artifacts to main,
  # so they must queue rather than race each other's pushes.
  group: board-artifacts
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build board
        run: python scripts/mma_board_cron.py
      - name: Commit artifacts
        run: |
          git config user.name  "mma-board-bot"
          git config user.email "mma-board-bot@users.noreply.github.com"
          git add mma_board_latest.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "mma-board: refresh board [skip ci]"
          # The board bots race each other: all four push artifacts to main, GitHub delays
          # scheduled runs so they bunch together, and a bare push loses with "fetch first"
          # (mma-board died exactly this way on 2026-10-03 18:36Z, one minute after hr-board).
          # Rebase onto whatever landed first and retry with backoff so a lost race self-heals.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main && git push -q; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i lost the race; retrying"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
