name: nhl-board

# Builds the NHL anytime goal-scorer board and commits it back to this repo (auto-redeploys the
# app on Render). The NHL plays most nights, so unlike the weekly NFL board this runs daily:
#   14:00 UTC (10:00 ET) -- morning build, gets the slate on the board early
#   22:00 UTC (18:00 ET) -- refresh close to puck drop on the freshest odds
# Cost is modest: 2 event-calls per game (game lines + props) x ~10 games a night.
# Features are pulled with an explicit gameDate <= yesterday window, so a re-run can never pull
# tonight's results into tonight's features (Ozzie Rule #1).

on:
  schedule:
    # Drift-aware (see td_board.yml header): the old 22:00 slot was executing ~00:52 UTC, i.e.
    # after the early puck drops it was meant to precede. Moved earlier so +5h still beats 7pm ET.
    - cron: '23 13 * * *'     # morning build
    - cron: '23 19 * * *'     # 15:23 ET -- pre-puck-drop refresh even with heavy drift
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # SHARED across every board workflow: they all commit artifacts to main,
  # so they must queue rather than race each other's pushes.
  group: board-artifacts
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build board
        run: python scripts/nhl_board_cron.py
      - name: Commit artifacts
        run: |
          git config user.name  "nhl-board-bot"
          git config user.email "nhl-board-bot@users.noreply.github.com"
          git add nhl_board_latest.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "nhl-board: refresh board [skip ci]"
          # The board bots race each other: all four push artifacts to main, GitHub delays
          # scheduled runs so they bunch together, and a bare push loses with "fetch first"
          # (mma-board died exactly this way on 2026-10-03 18:36Z, one minute after hr-board).
          # Rebase onto whatever landed first and retry with backoff so a lost race self-heals.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main && git push -q; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i lost the race; retrying"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
