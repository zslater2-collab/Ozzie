name: td-board

# Builds the NFL anytime-TD board + runs the H1 forward-tracker, commits artifacts back to this
# repo (auto-redeploys the app on Render). NFL plays Thu/Sun/Mon, so a weekly cadence:
#   Thu 15:00 UTC (11:00 ET) -- build the week's board (+ Thursday night game)
#   Sun 14:00 UTC (10:00 ET) -- refresh before the main 1pm slate (freshest odds)
#   Tue 14:00 UTC (10:00 ET) -- grade the completed week (all games final)
# The board only prices upcoming games, so runs are cheap on odds credits.

on:
  schedule:
    - cron: '0 15 * * 4'
    - cron: '0 14 * * 0'
    - cron: '0 14 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # SHARED across every board workflow: they all commit artifacts to main,
  # so they must queue rather than race each other's pushes.
  group: board-artifacts
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install nflreadpy polars scipy requests
      - name: Build board + tracker
        run: python scripts/td_board_cron.py
      - name: Commit artifacts
        run: |
          git config user.name  "td-board-bot"
          git config user.email "td-board-bot@users.noreply.github.com"
          git add td_board_latest.json nfl_watchlist_log.csv
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "td-board: refresh board + tracker [skip ci]"
          # The board bots race each other: all four push artifacts to main, GitHub delays
          # scheduled runs so they bunch together, and a bare push loses with "fetch first"
          # (mma-board died exactly this way on 2026-10-03 18:36Z, one minute after hr-board).
          # Rebase onto whatever landed first and retry with backoff so a lost race self-heals.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main && git push -q; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i lost the race; retrying"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
