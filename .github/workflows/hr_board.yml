name: hr-board

# Builds the HR/DFS board daily and commits the artifacts back to this repo,
# which auto-redeploys the app on Render. Runs staggered so each slate's lineups
# are captured once they post (lineups drop ~3-4h before first pitch). The display
# shows only upcoming games; the archive keeps the full slate for grading.
#   15:00 UTC = 11:00 ET (day-game lineups)
#   20:00 UTC = 16:00 ET (evening ~7pm slate lineups)
#   23:30 UTC = 19:30 ET (late ~9:40pm west-coast lineups)

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'
    - cron: '30 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: hr-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    # ODDS_API_KEY (repo secret) powers the anytime-HR edge layer. If it's unset the board still
    # builds and just ranks by probability as before (fetch_hr_odds fail-opens). HR_ODDS_REGIONS
    # defaults to 'us' (~1 credit/event); set to 'us,us2' to add theScore/Fanatics at 2x cost.
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      HR_ODDS_REGIONS: us
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pybaseball pandas numpy requests

      - name: Build board + grade
        run: python scripts/hr_board_cron.py

      - name: Commit artifacts
        run: |
          git config user.name  "hr-board-bot"
          git config user.email "hr-board-bot@users.noreply.github.com"
          git add hr_board_latest.json hr_board_perf.json hr_board_archive.csv data/hr_pa_2026.csv.gz
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "hr-board $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
