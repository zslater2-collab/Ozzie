name: hr-board

# Builds the HR/DFS board daily and commits the artifacts back to this repo,
# which auto-redeploys the app on Render. Runs staggered so each slate's lineups
# are captured once they post (lineups drop ~3-4h before first pitch). The display
# shows only upcoming games; the archive keeps the full slate for grading.
#   14:00 UTC = 10:00 ET (early getaway-day ~12-1pm lineups -- more lead on the early slate)
#   15:00 UTC = 11:00 ET (day-game lineups)
#   20:00 UTC = 16:00 ET (evening ~7pm slate lineups)
#   23:30 UTC = 19:30 ET (late ~9:40pm west-coast lineups)
#   01:00 UTC = 21:00 ET (catches 9pm+ ET games whose HR props post after the 19:30 run)
#   02:30 UTC = 22:30 ET (catches 10pm+ ET west-coast games) -- prices only the few still-upcoming
#   late games (started games are skipped), so these late runs are cheap on credits. Carry-forward
#   in hr_board_cron keeps earlier games' captured odds from being blanked by these later runs.

on:
  schedule:
    - cron: '0 14 * * *'
    - cron: '0 15 * * *'
    - cron: '0 20 * * *'
    - cron: '30 23 * * *'
    - cron: '0 1 * * *'
    - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # SHARED across every board workflow: they all commit artifacts to main,
  # so they must queue rather than race each other's pushes.
  group: board-artifacts
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    # ODDS_API_KEY (repo secret) powers the anytime-HR edge layer. If it's unset the board still
    # builds and just ranks by probability as before (fetch_hr_odds fail-opens). Regions DON'T
    # overlap: us = DK/FanDuel/BetMGM/Caesars/BetRivers; us2 = theScore/Fanatics/Bally Bet/Hard Rock.
    # HR props from the majors post late, so 'us' alone is often 1 book early -> use both for real
    # multi-book shopping + de-vig (2 credits/event, ~90/day).
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      HR_ODDS_REGIONS: us,us2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pybaseball pandas numpy requests

      - name: Build board + grade
        run: python scripts/hr_board_cron.py

      - name: Commit artifacts
        run: |
          git config user.name  "hr-board-bot"
          git config user.email "hr-board-bot@users.noreply.github.com"
          git add hr_board_latest.json hr_board_perf.json hr_board_archive.csv hr_board_graded.csv data/hr_pa_2026.csv.gz rain_flags_latest.json
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "hr-board $(date -u +%Y-%m-%dT%H:%MZ)"
          # The board bots race each other: all four push artifacts to main, GitHub delays
          # scheduled runs so they bunch together, and a bare push loses with "fetch first"
          # (mma-board died exactly this way on 2026-10-03 18:36Z, one minute after hr-board).
          # Rebase onto whatever landed first and retry with backoff so a lost race self-heals.
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash -q origin main && git push -q; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i lost the race; retrying"
            sleep $(( (RANDOM % 10) + 5 ))
          done
          echo "::error::could not push after 5 attempts"
          exit 1
